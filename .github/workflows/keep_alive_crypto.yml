name: Keep Cryto Streamlit App Alive

on:
  schedule:
    - cron: '0 0,8,16 * * *'  # Runs every 8 hours to stay within Streamlit's 12 hour sleep window
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          https://milcahjoseph-crypto-dashboard.streamlit.app
