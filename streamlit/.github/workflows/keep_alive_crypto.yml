name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 12 * * 2,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          https://milcahjoseph-crypto-dashboard.streamlit.app
